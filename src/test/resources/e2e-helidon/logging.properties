# java.util.logging, read by Helidon from the classpath: Helidon, Weld, Jersey, Narayana and Doer write to it.
# The console handler of Helidon writes to stdout, which the tests read
handlers=io.helidon.logging.jul.HelidonConsoleHandler
.level=INFO
io.helidon.logging.jul.HelidonConsoleHandler.level=FINE
java.util.logging.SimpleFormatter.format=%1$tF %1$tT.%1$tL %4$s {%3$s} %5$s%6$s%n
# The FINE messages of Doer: the limits and loaded rows of the sub-queues (ConcurrencyE2E)
com.doer.level=FINE
