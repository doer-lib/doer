# The web server of Helidon on all interfaces of the container
server.host=0.0.0.0
server.port=8080
# The database of Producers; the environment variables E2E_DB_URL, E2E_DB_USER and E2E_DB_PASSWORD override them.
# The defaults are for a run from the IDE (doer.e2e.runtime=external)
e2e.db.url=jdbc:postgresql://localhost:5432/doer
e2e.db.user=doer
e2e.db.password=doer
