name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  java-compatibility:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        version: [ 17, 21, 25, 27 ]
    steps:
      - uses: actions/checkout@v7

      # Per-PR Maven repository cache: each PR build restores the latest cache of this PR and saves a new one
      - name: Restore Maven repository
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: maven-pr-${{ github.event.pull_request.number }}-

      # Java27 is used to build library (but --release=17)
      - name: Set up JDK 27 (for building)
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -B --color=always -DskipTests package

      - name: Set up Java${{ matrix.version }} (for testing)
        uses: actions/setup-java@v6
        with:
          java-version: '${{ matrix.version }}'
          distribution: 'temurin'
      - name: Show java version
        run: java -version
      - name: Show mvn version
        run: mvn --version
      - name: Tests Java${{ matrix.version }} jakarta 10.0.0
        run: mvn -B --color=always verify

      # For the job test-summary
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.version }}
          path: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Save Maven repository
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.version == 27 }}
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: maven-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

  # E2E suite (*E2E classes): Transit Sims in each runtime, in Docker, with one JDK; see src/test/README.md
  runtime-e2e:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [ quarkus, spring-boot, wildfly, open-liberty, jetty ]
    steps:
      - uses: actions/checkout@v7

      # Per-PR Maven repository cache, per runtime: the runtimes bring different dependencies
      - name: Restore Maven repository
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-e2e-${{ matrix.runtime }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: maven-e2e-${{ matrix.runtime }}-pr-${{ github.event.pull_request.number }}-

      - name: Set up JDK 27 (for building)
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -B --color=always -DskipTests package

      # One JDK for the e2e suite: it builds Transit Sims, and the application runs on a JRE 25 image
      - name: Set up JDK 25 (for e2e)
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: E2E ${{ matrix.runtime }}
        run: mvn -B --color=always verify -Ddoer.e2e.runtime=${{ matrix.runtime }}

      # Application logs and the generated project, to reproduce a failure
      - name: Upload application logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.runtime }}
          path: target/e2e-test-workspaces/

      # For the job test-summary
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-e2e-${{ matrix.runtime }}
          # CPU and I/O of the application containers, for the first rows of the table of E2E runtimes
          path: |
            target/failsafe-reports/TEST-*.xml
            target/e2e-test-workspaces/*/container-usage.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Save Maven repository
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: maven-e2e-${{ matrix.runtime }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Tables of test times per JDK and per runtime in the summary of the run
  test-summary:
    needs: [ java-compatibility, runtime-e2e ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read # the jobs of the run, for the wallclock of each matrix
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Download test reports
        uses: actions/download-artifact@v8
        with:
          pattern: test-reports-*
          path: test-reports
      - name: Get jobs of the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs"
          --jq '.jobs[] | {name, started_at, completed_at}' > jobs.jsonl
      - name: Write test summary
        run: >
          python3 .github/scripts/test-summary.py --reports test-reports --jobs jobs.jsonl
          --matrix "Java versions" java-compatibility test-reports-java-
          --matrix "E2E runtimes" runtime-e2e test-reports-e2e-
          >> "$GITHUB_STEP_SUMMARY"
